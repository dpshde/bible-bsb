[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
rustflags = [
    "-Z",
    "no-unique-section-names",
    "-C",
    "target-cpu=cortex-m4",
    "-C",
    "panic=abort",
    "-C",
    "debuginfo=0",
    "-C",
    "opt-level=z",
    "-C",
    "embed-bitcode=yes",
    "-C",
    "lto=yes",
    "-C",
    "link-args=--script=flipperzero-rt.ld --Bstatic --relocatable --discard-all --strip-all --lto-O3 --lto-whole-program-visibility",
]
